services:
  - type: web
    name: MedSource-rag-api
    env: python
    runtime: python-3.11.10
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      python --version
      pip install --upgrade pip
      pip install -r requirements.txt
      bash scripts/download_vector_store.sh || echo "No vector store URL provided, will need manual upload"
    # Single worker: avoids FAISS shared-memory races and stays within the
    # 512 MB RAM limit on Render free tier.
    startCommand: gunicorn src.api:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: VECTOR_STORE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Key callers must send in X-API-Key header. Leave blank to disable auth.
      - key: CHATBOT_API_KEY
        sync: false
      # Comma-separated list of allowed frontend origins (CORS).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: EMBEDDING_MODEL
        value: BAAI/bge-base-en-v1.5
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_TEMPERATURE
        value: "0.1"
      - key: MAX_TOKENS
        value: "1000"
      - key: TOP_K_DOCUMENTS
        value: "5"
      - key: RETRIEVAL_CONFIDENCE_THRESHOLD
        value: "0.3"
      - key: VECTOR_STORE_PATH
        value: ./data/vector_store
      - key: CHUNK_SIZE
        value: "256"
      - key: CHUNK_OVERLAP
        value: "40"
      - key: EMBEDDING_BATCH_SIZE
        value: "32"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: VECLIB_MAXIMUM_THREADS
        value: "1"
